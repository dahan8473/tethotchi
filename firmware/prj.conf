CONFIG_LOG=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_REBOOT=y

# Bluetooth peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Tethos Pet"

# DFU over BLE: MCUmgr + SMP GATT service + image/OS management
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=y

# Pet save lives in its own flash partition, outside the image slots
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
